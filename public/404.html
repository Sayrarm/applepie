<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/apple-2.png"/>
    <link rel="icon" href="/apple-2.png"/> <!-- для iOS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cookie&family=Montserrat:ital,wght@0,100..900;1,100..900&family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap"
          rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Applepie</title>
    <script>
        const fullPath = window.location.pathname;
        const cleanPath = fullPath.replace('/applepie', '');
        sessionStorage.setItem('redirectPath', cleanPath);
        window.location.href = '/applepie/';
    </script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
